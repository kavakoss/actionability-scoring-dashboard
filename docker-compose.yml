services:
  frontend:
    build: ./frontend
    expose:
      - "3000"
    depends_on:
      - backend
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    expose:
      - "8000"
  nginx:
    build: ./nginx
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - backend
